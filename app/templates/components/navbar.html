<header class="nxl-header">
    <div class="header-wrapper">
        <div class="header-left d-flex align-items-center gap-4">
            <a href="javascript:void(0);" class="nxl-head-mobile-toggler" id="mobile-collapse">
                <div class="hamburger hamburger--arrowturn">
                    <div class="hamburger-box">
                        <div class="hamburger-inner"></div>
                    </div>
                </div>
            </a>
            <div class="nxl-navigation-toggle">
                <a href="javascript:void(0);" id="menu-mini-button">
                    <i class="feather-align-left"></i>
                </a>
                <a href="javascript:void(0);" id="menu-expend-button" style="display: none">
                    <i class="feather-arrow-right"></i>
                </a>
            </div>
        </div>
        <div class="header-right ms-auto">
            <div class="d-flex align-items-center">
                <div class="nxl-h-item d-none d-sm-flex">
                    <div class="full-screen-switcher">
                        <a href="javascript:void(0);" class="nxl-head-link me-0" onclick="$('body').fullScreenHelper('toggle');">
                            <i class="feather-maximize maximize"></i>
                            <i class="feather-minimize minimize"></i>
                        </a>
                    </div>
                </div>
                <div class="nxl-h-item dark-light-theme">
                    <a href="javascript:void(0);" class="nxl-head-link me-0 dark-button" onclick="SGEToggleTheme('dark')">
                        <i class="feather-moon"></i>
                    </a>
                    <a href="javascript:void(0);" class="nxl-head-link me-0 light-button" style="display: none" onclick="SGEToggleTheme('light')">
                        <i class="feather-sun"></i>
                    </a>
                </div>
                <div class="dropdown nxl-h-item">
                    <a href="javascript:void(0);" data-bs-toggle="dropdown" role="button" data-bs-auto-close="outside" class="c-pointer">
                        <div class="avatar-text avatar-sm bg-soft-primary text-primary">
                            <span class="fw-bold">{{ user.first_name|default:user.username|slice:":1"|upper }}</span>
                        </div>
                    </a>
                    <div class="dropdown-menu dropdown-menu-end nxl-h-dropdown nxl-user-dropdown">
                        <div class="dropdown-header">
                            <div class="d-flex align-items-center">
                                <div class="avatar-text avatar-md bg-soft-primary text-primary me-3">
                                    <span class="fw-bold">{{ user.first_name|default:user.username|slice:":1"|upper }}</span>
                                </div>
                                <div>
                                    <h6 class="text-dark mb-0">{{ user.get_full_name|default:user.username }}</h6>
                                    <span class="fs-12 fw-medium text-muted">{{ user.email }}</span>
                                </div>
                            </div>
                        </div>
                        <div class="dropdown-divider"></div>
                        <a href="{% url 'profile_edit' %}" class="dropdown-item">
                            <i class="feather-user"></i>
                            <span>Perfil</span>
                        </a>
                        {% if user.is_staff %}
                        <a href="{% url 'settings' %}" class="dropdown-item">
                            <i class="feather-settings"></i>
                            <span>Configura&ccedil;&otilde;es</span>
                        </a>
                        {% endif %}
                        <div class="dropdown-divider"></div>
                        <a href="{% url 'logout' %}" class="dropdown-item text-danger">
                            <i class="feather-log-out"></i>
                            <span>Sair</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<script>
    function SGEToggleTheme(theme) {
        var html = document.documentElement;
        html.classList.remove('app-skin-dark', 'app-skin-light');
        html.classList.add('app-skin-' + theme);
        html.setAttribute('data-bs-theme', theme);
        localStorage.setItem('app-skin-dark', 'app-skin-' + theme);
        var body = document.body;
        body.className = body.className.replace(/theme-\w+/, 'theme-' + theme);
        var csrf = (document.cookie.match(/csrftoken=([^;]+)/) || [])[1] || '';
        fetch('{% url "save_theme" %}', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
            body: JSON.stringify({ theme: theme }),
        });
    }
</script>
