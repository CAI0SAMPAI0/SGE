<div class="row mt-4">
    <div class="col-xxl-3 col-md-6">
        <div class="card stretch stretch-full">
            <div class="card-body">
                <div class="d-flex align-items-start justify-content-between mb-4">
                    <div class="d-flex gap-4 align-items-center">
                        <div class="avatar-text avatar-lg bg-soft-primary text-primary">
                            <i class="feather-box"></i>
                        </div>
                        <div>
                            <div class="fs-4 fw-bold text-dark"><span class="counter">{{ product_metrics.total_quantity }}</span></div>
                            <h3 class="fs-13 fw-semibold text-truncate-1-line">Quantidade de Produtos</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-xxl-3 col-md-6">
        <div class="card stretch stretch-full">
            <div class="card-body">
                <div class="d-flex align-items-start justify-content-between mb-4">
                    <div class="d-flex gap-4 align-items-center">
                        <div class="avatar-text avatar-lg bg-soft-danger text-danger">
                            <i class="feather-dollar-sign"></i>
                        </div>
                        <div>
                            <div class="fs-4 fw-bold text-dark">R$ {{ product_metrics.total_cost_price }}</div>
                            <h3 class="fs-13 fw-semibold text-truncate-1-line">Custo do Estoque</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-xxl-3 col-md-6">
        <div class="card stretch stretch-full">
            <div class="card-body">
                <div class="d-flex align-items-start justify-content-between mb-4">
                    <div class="d-flex gap-4 align-items-center">
                        <div class="avatar-text avatar-lg bg-soft-success text-success">
                            <i class="feather-trending-up"></i>
                        </div>
                        <div>
                            <div class="fs-4 fw-bold text-dark">R$ {{ product_metrics.total_selling_price }}</div>
                            <h3 class="fs-13 fw-semibold text-truncate-1-line">Valor do Estoque</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-xxl-3 col-md-6">
        <div class="card stretch stretch-full">
            <div class="card-body">
                <div class="d-flex align-items-start justify-content-between mb-4">
                    <div class="d-flex gap-4 align-items-center">
                        <div class="avatar-text avatar-lg bg-soft-warning text-warning">
                            <i class="feather-award"></i>
                        </div>
                        <div>
                            <div class="fs-4 fw-bold text-dark">R$ {{ product_metrics.total_profit }}</div>
                            <h3 class="fs-13 fw-semibold text-truncate-1-line">Lucro do Estoque</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
