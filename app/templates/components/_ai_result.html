<div class="mb-4">
    <button class="btn btn-sm btn-outline-primary w-100 text-start d-flex align-items-center justify-content-between px-3 py-2"
            id="sgeAgentToggle"
            data-bs-toggle="collapse"
            data-bs-target="#sgeAgentCard"
            aria-expanded="false"
            aria-controls="sgeAgentCard">
        <span><i class="feather-cpu me-2"></i>SGE Agent</span>
        <span><i class="feather-chevron-right" id="sgeAgentChevron"></i></span>
    </button>
    <div id="sgeAgentCard" class="collapse mt-2">
        <div class="card stretch stretch-full">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0">
                    <i class="feather-cpu me-2"></i>SGE Agent
                </h5>
                <button id="sgeReloadBtn" type="button"
                        class="btn btn-sm btn-light-brand"
                        title="Gerar novo insight"
                        onclick="window.SGEReloadAgent(this)">
                    <i class="feather-refresh-cw me-1"></i>
                    <span>Atualizar</span>
                </button>
            </div>
            <div class="card-body">
                <div id="sgeAgentResult" class="markdown-body" data-md>{{ ai_result|default:"Nenhum insight disponível. Clique em **Atualizar** para gerar um relatório." }}</div>
            </div>
        </div>
    </div>
</div>

<script>
    (function () {
        var toggle = document.getElementById('sgeAgentToggle');
        var card = document.getElementById('sgeAgentCard');
        var chevron = document.getElementById('sgeAgentChevron');
        if (toggle && card) {
            card.addEventListener('show.bs.collapse', function () {
                if (chevron) chevron.style.transform = 'rotate(90deg)';
            });
            card.addEventListener('hide.bs.collapse', function () {
                if (chevron) chevron.style.transform = 'rotate(0deg)';
            });
        }
        function renderResult(text) {
            var el = document.getElementById('sgeAgentResult');
            if (!el) return;
            if (!window.marked) { el.textContent = text; return; }
            el.innerHTML = window.marked.parse(text);
        }
        window.SGEReloadAgent = function (btn) {
            if (!btn) return;
            var original = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="feather-loader me-1"></i>Gerando...';
            fetch('{% url "ai:ai_reload" %}', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': (document.cookie.match(/csrftoken=([^;]+)/) || [])[1] || '',
                    'Accept': 'application/json',
                },
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data && data.result) renderResult(data.result);
                    else if (data && data.error) alert(data.error);
                })
                .catch(function () { alert('Falha ao contatar o SGE Agent.'); })
                .finally(function () {
                    btn.disabled = false;
                    btn.innerHTML = original;
                });
        };
        document.addEventListener('DOMContentLoaded', function () {
            var el = document.getElementById('sgeAgentResult');
            if (el) renderResult(el.textContent);
        });
    })();
</script>
