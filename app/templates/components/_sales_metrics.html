<div class="row mt-4">
    <div class="col-xxl-3 col-md-6">
        <div class="card stretch stretch-full">
            <div class="card-body">
                <div class="d-flex align-items-start justify-content-between mb-4">
                    <div class="d-flex gap-4 align-items-center">
                        <div class="avatar-text avatar-lg bg-soft-primary text-primary">
                            <i class="feather-shopping-cart"></i>
                        </div>
                        <div>
                            <div class="fs-4 fw-bold text-dark"><span class="counter">{{ sales_metrics.total_sales }}</span></div>
                            <h3 class="fs-13 fw-semibold text-truncate-1-line">Quantidade de Vendas</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-xxl-3 col-md-6">
        <div class="card stretch stretch-full">
            <div class="card-body">
                <div class="d-flex align-items-start justify-content-between mb-4">
                    <div class="d-flex gap-4 align-items-center">
                        <div class="avatar-text avatar-lg bg-soft-danger text-danger">
                            <i class="feather-package"></i>
                        </div>
                        <div>
                            <div class="fs-4 fw-bold text-dark"><span class="counter">{{ sales_metrics.total_products_sold }}</span></div>
                            <h3 class="fs-13 fw-semibold text-truncate-1-line">Produtos Vendidos</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-xxl-3 col-md-6">
        <div class="card stretch stretch-full">
            <div class="card-body">
                <div class="d-flex align-items-start justify-content-between mb-4">
                    <div class="d-flex gap-4 align-items-center">
                        <div class="avatar-text avatar-lg bg-soft-success text-success">
                            <i class="feather-dollar-sign"></i>
                        </div>
                        <div>
                            <div class="fs-4 fw-bold text-dark">R$ {{ sales_metrics.total_sales_value }}</div>
                            <h3 class="fs-13 fw-semibold text-truncate-1-line">Valor das Vendas</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-xxl-3 col-md-6">
        <div class="card stretch stretch-full">
            <div class="card-body">
                <div class="d-flex align-items-start justify-content-between mb-4">
                    <div class="d-flex gap-4 align-items-center">
                        <div class="avatar-text avatar-lg bg-soft-warning text-warning">
                            <i class="feather-trending-up"></i>
                        </div>
                        <div>
                            <div class="fs-4 fw-bold text-dark">R$ {{ sales_metrics.total_sales_profit }}</div>
                            <h3 class="fs-13 fw-semibold text-truncate-1-line">Lucro das Vendas</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
