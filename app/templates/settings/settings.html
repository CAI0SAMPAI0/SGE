{% extends 'base.html' %}
{% load static %}
{% block title %}Configurações{% endblock %}
{% block content %}
<div class="container mx-auto p-4">
  <h1 class="text-2xl font-bold mb-4 text-white">Configurações</h1>
  <form class="space-y-4" method="POST">
  {% csrf_token %}
    <div class="flex items-center">
      <label class="text-gray-200 mr-2" for="theme">Tema:</label>
      <select id="theme" name="theme" class="bg-gray-800 text-white rounded p-1">
        <option value="dark" selected>Escuro</option>
        <option value="light">Claro</option>
      </select>
    </div>
    <div class="flex items-center">
      <label class="text-gray-200 mr-2" for="results_limit">Limite de resultados da IA:</label>
      <input type="number" id="results_limit" name="results_limit" class="bg-gray-800 text-white rounded p-1 w-20" min="1" max="50" value="20" />
    </div>
    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded">
      Salvar
    </button>
  </form>
</div>
{% endblock %}
<script src="{% static 'js/ui.js' %}"></script>
